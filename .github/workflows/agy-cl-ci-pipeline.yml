name: "Agy 2.0 Headless CL/CI Pipeline (6 Harness Elements)"

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.agents/**'
      - 'mcp_servers/**'
      - 'scripts/**'
      - '.github/workflows/**'

# 對應第 7.4.1 / 7.10.4 節：針對同一 PR 的連續推送，自動取消正在運行的舊任務以節省 API 成本
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 階段 1：快速 Harness 完整性與 MCP / Hooks 自檢 (對應第 7.5 節多階段流水線)
  # ============================================================================
  stage1-harness-preflight:
    name: "Stage 1: Verify 6 Harness Elements & MCP Server"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify MCP Server (sqlite-schema-mcp) Self-Test
        run: |
          python mcp_servers/sqlite_schema_mcp.py --self-test > mcp_self_test.json
          cat mcp_self_test.json

      - name: Verify Lifecycle Hooks (PreToolUse Security Block Test)
        run: |
          RESULT=$(echo '{"toolCall":{"name":"run_command","args":{"CommandLine":"rm -rf /"}}}' | python scripts/hooks/pre_tool_security_guard.py)
          echo "Hook Output: $RESULT"
          DECISION=$(echo "$RESULT" | jq -r '.decision')
          if [ "$DECISION" != "deny" ]; then
            echo "::error::PreToolUse Hook 未能成功攔截危險指令！"
            exit 1
          fi
          echo "✅ PreToolUse Hook 成功攔截危險命令 (decision=deny)"

  # ============================================================================
  # 階段 2：執行 Agy 2.0 Headless 深度審查、發佈 PR 評論並上傳審計日誌
  # ============================================================================
  stage2-headless-ai-audit:
    name: "Stage 2: Agy 2.0 Headless CL Audit & PR Report"
    runs-on: ubuntu-latest
    needs: stage1-harness-preflight
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Agy 2.0 Headless 6-Harness Orchestrator
        id: agy_audit
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          BASH_DEFAULT_TIMEOUT_MS: "120000"
          MAX_MCP_OUTPUT_TOKENS: "25000"
        run: |
          chmod +x ./scripts/run_agy_headless_ci.sh
          ./scripts/run_agy_headless_ci.sh observer

          VERDICT=$(jq -r '.structured_output.verdict' reports/cl_review_report.json)
          CRIT_COUNT=$(jq -r '.structured_output.critical_count' reports/cl_review_report.json)
          COST=$(jq -r '.total_cost_usd' reports/cl_review_report.json)

          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "critical_count=$CRIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "cost=$COST" >> "$GITHUB_OUTPUT"

          # 將報告同步渲染至 GitHub Actions Job Summary
          cat reports/pr_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post Structured Review Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/pr_comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Upload Headless Audit Logs & JSON Reports (Sec 7.10.5)
        uses: actions/upload-artifact@v4
        with:
          name: agy2-headless-audit-artifacts
          path: |
            reports/cl_review_report.json
            reports/pr_comment.md
            logs/headless_hook_audit.jsonl
